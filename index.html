<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="ikk.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IKK Toolkit Mockup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#a8d7e9;color:#51473f;font-family:'Noto Sans Thai',sans-serif}
.app{max-width:1400px;margin:auto;padding:28px 40px}.brand{margin-left:380px;margin-bottom:18px}
.brand small,.side-title,.tool h2{font-family:Mitr,sans-serif}.brand small{font-size:28px;font-weight:600}
.brand h1{margin:0;font:500 64px/1 Mitr,sans-serif}
.layout{display:grid;grid-template-columns:360px 1fr;gap:40px}
.sidebar,.content{background:#fff;border-radius:30px;box-shadow:0 12px 30px #51473f18}
.sidebar{padding:20px 26px;min-height:650px}
.character{height:255px;border-radius:22px;background:linear-gradient(#e9f7ff,#fff0f6);display:grid;place-items:center;font-size:72px;margin-bottom:10px}
.character img{width:100%;height:100%;object-fit:contain}
.side-title{font-size:26px;margin:5px 0 14px}.group{font:600 15px Mitr;color:#8b7b70;margin:18px 0 8px}
.nav{display:grid;gap:9px}.nav button{border:2px solid transparent;background:#fffaf5;color:#5a5049;padding:13px 14px;border-radius:15px;text-align:left;cursor:pointer}
.nav button.active{background:#fff3d6;border-color:#ffbd2e;font-weight:700}
.nav button:hover{transform:translateX(3px)}.icon{display:inline-block;width:28px}
.content{padding:24px;min-height:650px}.tool h2{margin:0;font-size:28px}.tool p{margin:4px 0 18px;color:#8b7b70}
.card{background:#151821;color:#fff;border-radius:20px;padding:20px}.label{font-size:13px;color:#c5c9dc;margin-bottom:8px}
.row{display:flex;gap:10px}input{width:100%;background:#0d1017;color:white;border:1px solid #41475f;border-radius:13px;padding:13px;outline:0}
button.primary{border:0;border-radius:13px;padding:0 22px;background:#7d89ff;color:white;font-weight:700}
.result{margin-top:16px;border:1px solid #6978ff;background:#1b2034;border-radius:16px;overflow:hidden}
.title{padding:13px;color:#9ca8ff;font-size:12px;letter-spacing:.08em}.line{padding:11px 15px;border-top:1px solid #30354a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.stat{background:#10131b;border-radius:13px;padding:12px}.stat span{display:block;color:#8d93a9;font-size:12px}.stat strong{font-size:23px}.price strong{color:#9ca8ff}
@media(max-width:850px){.app{padding:18px}.brand{margin-left:0}.brand h1{font-size:45px}.layout{grid-template-columns:1fr}.sidebar{min-height:0}.nav{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="brand"><small>IKK คุณคิดมาแล้ว!</small><h1 id="title">Echoes Calculator</h1></header>
  <div class="layout">
    <aside class="sidebar">
      <div class="character">
    <img src="ikk-character.PNG" alt="IKK Character">
</div>
</div>
      <h2 class="side-title">IKK TOOLKIT</h2>
      <div class="group">CALCULATE</div>
      <div class="nav">
        <button class="active" onclick="show('echoes',this)">🔮　คำนวณจำนวน Echoes</button>
        <button onclick="show('points',this)">🧮　คำนวณยอดเติมสะสม</button>
        <button onclick="show('orb',this)">🔮　คำนวณลูกแก้ว</button>
      </div>
      <div class="group">TOOLS</div>
      <div class="nav">
        <button onclick="show('claim',this)">🎟️　สะสมแต้ม</button>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>
</div>
<script>
const packs=[{e:66,p:60,c:30},{e:203,p:185,c:90},{e:335,p:305,c:145}];
function p759(n){return n>=30?283:n>=20?285:n>=10?287:290}
function calc(target,mode='e'){
 let best=null;
 for(let a=0;a<=Math.ceil(target/66)+2;a++)for(let b=0;b<=Math.ceil(target/203)+2;b++)for(let c=0;c<=Math.ceil(target/335)+2;c++)for(let d=0;d<=Math.ceil(target/759)+2;d++){
  const v=a*(mode==='e'?66:60)+b*(mode==='e'?203:185)+c*(mode==='e'?335:305)+d*(mode==='e'?759:690);
  if(v<target)continue;
  const price=a*30+b*90+c*145+d*p759(d), echoes=a*66+b*203+c*335+d*759;
  if(!best||price<best.price||price===best.price&&echoes>best.echoes)best={a,b,c,d,price,echoes,v};
 }
 return best;
}
function result(b,target,label='Echoes'){
 return `<div class="result"><div class="title">CHEAPEST COMBINATION</div>
 ${b.d?`<div class="line"><b>759 Echoes × ${b.d}</b></div>`:''}
 ${b.c?`<div class="line"><b>335 Echoes × ${b.c}</b></div>`:''}
 ${b.b?`<div class="line"><b>203 Echoes × ${b.b}</b></div>`:''}
 ${b.a?`<div class="line"><b>66 Echoes × ${b.a}</b></div>`:''}</div>
 <div class="stats"><div class="stat"><span>ต้องการ ${label}</span><strong>${target.toLocaleString()}</strong></div>
 <div class="stat"><span>ได้รับ Echoes</span><strong>${b.echoes.toLocaleString()}</strong></div>
 <div class="stat price"><span>ราคา</span><strong>${b.price.toLocaleString()}฿</strong></div></div>`;
}
function show(page,btn){
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); if(btn)btn.classList.add('active');
 const c=document.getElementById('content'),t=document.getElementById('title');
 if(page==='echoes'){t.textContent='Echoes Calculator';c.innerHTML=`<div class="tool"><h2>🔮 คำนวณจำนวน Echoes</h2><p>หาชุดแพ็กที่คุ้มที่สุด</p><div class="card"><div class="label">ต้องการ Echoes เท่าไหร่?</div><div class="row"><input id="n" type="number" value="3288"><button class="primary" onclick="go()">คำนวณ</button></div><div id="r"></div></div></div>`;go()}
 if(page==='points'){t.textContent='Top-up Calculator';c.innerHTML=`<div class="tool"><h2>🪙 คำนวณยอดเติมสะสม</h2><p>คิดจากแต้มยอดเติมสะสมของแต่ละแพ็ก</p><div class="card"><div class="label">ต้องการแต้มสะสมเท่าไหร่?</div><div class="row"><input id="n" type="number" value="690"><button class="primary" onclick="gp()">คำนวณ</button></div><div id="r"></div></div></div>`;gp()}
 if(page==='orb'){t.textContent='Orb Calculator';c.innerHTML=`<div class="tool"><h2>🔮 คำนวณลูกแก้ว</h2><p>1 ลูกแก้ว = 96 Echoes</p><div class="card"><div class="label">ต้องการลูกแก้วกี่ลูก?</div><div class="row"><input id="n" type="number" value="10"><button class="primary" onclick="orb()">คำนวณ</button></div><div id="r"></div></div></div>`;orb()}
 if(page==='claim'){t.textContent='สะสมแต้ม';c.innerHTML=`<div class="tool"><h2>🎟️ สะสมแต้ม</h2><p>พื้นที่สำหรับย้ายระบบสะสมแต้มเดิมเข้ามาอยู่ใน Toolkit</p><div class="card" style="min-height:430px;display:grid;place-items:center;text-align:center"><div><div style="font-size:60px">🎟️</div><h2>เอาหน้าสะสมแต้มของพี่คิวมาใส่ตรงนี้</h2><p>ระบบ Google Apps Script เดิมยังใช้ต่อได้</p></div></div></div>`}
}
function go(){let n=+document.getElementById('n').value,b=calc(n,'e');document.getElementById('r').innerHTML=result(b,n)}
function gp(){let n=+document.getElementById('n').value,b=calc(n,'p');document.getElementById('r').innerHTML=result(b,n,'แต้มสะสม')}
function orb(){let n=+document.getElementById('n').value,b=calc(n*96,'e');document.getElementById('r').innerHTML=result(b,n*96,'Echoes')}
show('echoes',document.querySelector('.nav button'));
</script>
</body>
</html>
