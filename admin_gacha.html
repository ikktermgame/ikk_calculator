<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IKK รับเติมเกม — จับรางวัลกาชาปอง</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#7EC8E3;
    --lavender:#C9C2E8;
    --bubblegum:#FF8FC4;
    --deepblue:#2E7FC1;
    --cream:#F5FAFF;
    --peach:#FFD98E;
  }
  body{
    font-family:'Noto Sans Thai', sans-serif;
    background-color:var(--cream);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(126,200,227,0.35) 0, transparent 45%),
      radial-gradient(circle at 88% 4%, rgba(201,194,232,0.4) 0, transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(255,217,142,0.25) 0, transparent 40%);
  }
  .font-display{ font-family:'Mitr', sans-serif; }
  .brand-border{ border: 2.5px solid var(--sky); }

  @keyframes pop-in {
    0% { opacity:0; transform: scale(0.92) translateY(8px); }
    60% { opacity:1; transform: scale(1.02) translateY(-2px); }
    100% { opacity:1; transform: scale(1) translateY(0); }
  }
  .animate-pop { animation: pop-in 0.45s cubic-bezier(.2,.8,.3,1.1) both; }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .animate-shake { animation: shake 0.5s; }

  @keyframes float-slow {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }
  .float-slow { animation: float-slow 4.5s ease-in-out infinite; }

  .machine-dome{
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--sky) 55%, var(--deepblue) 100%);
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    box-shadow: inset 0 -10px 20px rgba(46,127,193,0.35), 0 6px 0 0 rgba(46,127,193,0.2);
  }
  .machine-base{
    background: linear-gradient(180deg, var(--lavender), #b3a8de);
    border-radius: 18px;
  }
  @keyframes shake-machine {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-2.5deg); }
    40% { transform: rotate(2.5deg); }
    60% { transform: rotate(-2deg); }
    80% { transform: rotate(2deg); }
  }
  .machine-shaking{ animation: shake-machine 0.35s ease-in-out infinite; }

  .draw-btn{ box-shadow: 0 6px 0 0 #e06aa0; }
  .draw-btn:active{ box-shadow: none; transform: translateY(6px); }
  .draw-btn:disabled{ opacity: 0.7; }

  .capsule{ perspective: 700px; height: 92px; }
  .capsule-inner{
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.2,.8,.3,1.1);
    opacity: 0;
    transform: scale(0.4) translateY(10px);
  }
  .capsule.shown .capsule-inner{
    opacity: 1;
    transform: scale(1) translateY(0) rotateY(0deg);
    transition: opacity 0.35s ease, transform 0.5s cubic-bezier(.2,.8,.3,1.2);
  }
  .capsule.opened .capsule-inner{ transform: scale(1) translateY(0) rotateY(180deg); }
  .capsule-face{
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 1.25rem;
    display:flex; align-items:center; justify-content:center;
    text-align: center;
  }
  .capsule-front{
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--face-color, var(--sky)));
    border: 2px solid rgba(255,255,255,0.7);
  }
  .capsule-back{
    background: white;
    border: 2px solid var(--peach);
    transform: rotateY(180deg);
    padding: 6px;
  }
</style>
</head>
<body class="min-h-screen flex justify-center px-4 py-8">

  <!-- PIN GATE MODAL — เช็คที่ Backend (verify_admin) และใช้ sessionStorage ร่วมกับ admin.html
       เพื่อไม่ต้องกรอก PIN ซ้ำเวลาสลับหน้าไปมา -->
  <div id="lockOverlay" class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 px-4">
    <div class="relative bg-white rounded-3xl brand-border p-6 w-full max-w-xs text-center animate-pop">
      <div class="absolute -top-3 -right-2 bg-[var(--peach)] text-[11px] font-semibold text-slate-700 px-3 py-1 rounded-full rotate-6 shadow-sm">Admin</div>

      <div class="float-slow inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[var(--cream)] mb-3">
        <span class="text-2xl">🔒</span>
      </div>

      <h2 class="font-display text-lg font-semibold text-[var(--deepblue)] mb-1">ใส่รหัสผ่านแอดมิน</h2>
      <p class="text-xs text-slate-400 mb-4">สำหรับพนักงานร้านเท่านั้น</p>

      <form id="pinForm" class="flex flex-col gap-3">
        <input
          id="pinInput" type="password" inputmode="numeric" required autofocus
          placeholder="••••"
          class="w-full text-center tracking-[0.4em] text-lg rounded-2xl border-2 border-slate-200 focus:border-[var(--sky)] focus:ring-4 focus:ring-[var(--sky)]/20 outline-none px-4 py-3 text-slate-700 placeholder:text-slate-300 placeholder:tracking-normal transition"
        />
        <button type="submit"
          class="rounded-2xl bg-[var(--bubblegum)] hover:bg-[#ff7ab8] active:scale-[0.98] text-white font-medium py-3 shadow-[0_4px_0_0_#e06aa0] active:shadow-none active:translate-y-1 transition-all">
          ปลดล็อก
        </button>
      </form>

      <p id="pinError" class="hidden mt-3 text-sm text-rose-500 bg-rose-50 rounded-xl px-3 py-2">รหัสผ่านไม่ถูกต้อง ลองอีกครั้งนะ</p>
    </div>
  </div>

  <div id="pageContent" class="w-full max-w-md" style="visibility:hidden;">

    <!-- ===== Header / brand ===== -->
    <header class="relative text-center mb-6 pt-2">
      <div class="absolute -top-3 left-2 w-14 h-14 rounded-full bg-[var(--lavender)]/50 blur-xl"></div>
      <div class="absolute -top-1 right-4 w-10 h-10 rounded-full bg-[var(--peach)]/50 blur-lg"></div>

      <div class="relative float-slow inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white brand-border shadow-sm mb-3">
        <span class="text-2xl">🎰</span>
      </div>

      <h1 class="font-display text-2xl font-semibold text-[var(--deepblue)]">IKK รับเติมเกม</h1>
      <p class="text-sm text-slate-500 mt-1">จับรางวัลกาชาปอง · 10 สิทธิ์ต่อรอบ</p>
      <a href="admin.html" class="inline-block mt-2 text-xs text-[var(--deepblue)] underline underline-offset-2">🎮 ไปหน้าสร้างโค้ดรับแต้ม</a>
    </header>

    <!-- ===== Gacha machine + draw button ===== -->
    <section class="relative bg-white rounded-3xl brand-border p-6 shadow-[0_6px_0_0_rgba(126,200,227,0.25)] flex flex-col items-center">
      <span class="absolute -top-3 -right-2 bg-[var(--peach)] text-[11px] font-semibold text-slate-700 px-3 py-1 rounded-full rotate-6 shadow-sm">Admin</span>

      <div id="machineDome" class="machine-dome w-40 h-32 relative flex items-center justify-center mb-1">
        <span class="text-4xl">🎁</span>
      </div>
      <div class="machine-base w-32 h-6 -mt-1 mb-5"></div>

      <button id="drawBtn"
        class="draw-btn w-full flex items-center justify-center gap-2 rounded-2xl bg-[var(--bubblegum)] hover:bg-[#ff7ab8] active:scale-[0.98] text-white font-medium py-4 transition-all">
        <span id="drawBtnLabel" class="font-display">🎉 หมุนสุ่มรางวัล 10 สิทธิ์!</span>
      </button>

      <p id="drawError" class="hidden mt-3 text-sm text-rose-500 bg-rose-50 rounded-xl px-3 py-2 w-full text-center"></p>
    </section>

    <!-- ===== Winners reveal ===== -->
    <section id="winnersSection" class="hidden mt-5 bg-white rounded-3xl brand-border p-5 animate-pop">
      <div class="flex items-center justify-between mb-4">
        <p class="font-display text-base text-[var(--deepblue)] font-medium">🏆 ผู้โชคดีรอบนี้</p>
        <p id="drawIdLabel" class="text-xs text-slate-400"></p>
      </div>

      <div id="capsuleGrid" class="grid grid-cols-2 gap-3"></div>
    </section>

  </div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw3xipY2M3nkBGmAp2J-gt5wrc6f2wt_242F3vRHeaDUlX3B3yJGcIMIgpQXvGQn3rQ/exec';
  const PIN_STORAGE_KEY = 'ikk_admin_pin'; // sessionStorage คีย์เดียวกับ admin.html

  async function postAction(payload){
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  async function postAdminAction(payload){
    payload.pin = sessionStorage.getItem(PIN_STORAGE_KEY) || '';
    return postAction(payload);
  }

  // ---------- PIN gate ----------
  const lockOverlay = document.getElementById('lockOverlay');
  const pageContent = document.getElementById('pageContent');
  const pinForm = document.getElementById('pinForm');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');

  function unlockUI(){
    lockOverlay.remove();
    pageContent.style.visibility = 'visible';
  }

  async function tryUnlockWithStoredPin(){
    const storedPin = sessionStorage.getItem(PIN_STORAGE_KEY);
    if (!storedPin) return;

    try {
      const data = await postAction({ action: 'verify_admin', pin: storedPin });
      if (data.status === 'success') {
        unlockUI();
      } else {
        sessionStorage.removeItem(PIN_STORAGE_KEY);
      }
    } catch (err) {
      // เชื่อมต่อไม่ได้ตอนเปิดหน้า - ให้กรอก PIN เองตามปกติ
    }
  }

  tryUnlockWithStoredPin();

  pinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    pinError.classList.add('hidden');

    const enteredPin = pinInput.value.trim();
    if (!enteredPin) return;

    const submitBtn = pinForm.querySelector('button');
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังตรวจสอบ...';

    try {
      const data = await postAction({ action: 'verify_admin', pin: enteredPin });

      if (data.status === 'success') {
        sessionStorage.setItem(PIN_STORAGE_KEY, enteredPin);
        unlockUI();
      } else {
        pinError.classList.remove('hidden');
        pinInput.value = '';
        pinInput.focus();
        const modal = lockOverlay.querySelector('div');
        modal.classList.remove('animate-shake');
        void modal.offsetWidth;
        modal.classList.add('animate-shake');
      }
    } catch (err) {
      pinError.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
      pinError.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'ปลดล็อก';
    }
  });

  // ---------- Gacha draw ----------
  const drawBtn = document.getElementById('drawBtn');
  const drawBtnLabel = document.getElementById('drawBtnLabel');
  const drawError = document.getElementById('drawError');
  const machineDome = document.getElementById('machineDome');
  const winnersSection = document.getElementById('winnersSection');
  const capsuleGrid = document.getElementById('capsuleGrid');
  const drawIdLabel = document.getElementById('drawIdLabel');

  const capsuleColors = ['#7EC8E3', '#C9C2E8', '#FF8FC4', '#FFD98E'];

  function buildCapsuleGrid(count){
    capsuleGrid.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const wrapper = document.createElement('div');
      wrapper.className = 'capsule';
      wrapper.innerHTML = `
        <div class="capsule-inner">
          <div class="capsule-face capsule-front" style="--face-color:${capsuleColors[i % capsuleColors.length]}">
            <span class="text-2xl">🥚</span>
          </div>
          <div class="capsule-face capsule-back">
            <span class="text-xs font-medium text-[var(--deepblue)] leading-snug break-all"></span>
          </div>
        </div>
      `;
      capsuleGrid.appendChild(wrapper);
    }
  }

  function revealWinners(winners){
    winnersSection.classList.remove('hidden');
    winnersSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    const capsules = capsuleGrid.querySelectorAll('.capsule');

    capsules.forEach((capsule, i) => {
      const nameEl = capsule.querySelector('.capsule-back span');
      nameEl.textContent = winners[i];

      setTimeout(() => { capsule.classList.add('shown'); }, i * 90);

      const openDelay = capsules.length * 90 + 400 + i * 70;
      setTimeout(() => { capsule.classList.add('opened'); }, openDelay);
    });
  }

  drawBtn.addEventListener('click', async () => {
    drawError.classList.add('hidden');
    winnersSection.classList.add('hidden');

    drawBtn.disabled = true;
    drawBtnLabel.textContent = 'กำลังสุ่ม...';
    machineDome.classList.add('machine-shaking');

    try {
      await new Promise(resolve => setTimeout(resolve, 700));

      // ไม่ต้องพิมพ์ pin เอง — postAdminAction แนบให้จาก sessionStorage แบบไร้รอยต่อ
      const data = await postAdminAction({ action: 'gacha_draw' });

      if (data.status !== 'success') {
        drawError.textContent = data.message || 'สุ่มรางวัลไม่สำเร็จ กรุณาลองใหม่';
        drawError.classList.remove('hidden');
        if (data.message && data.message.indexOf('รหัสแอดมิน') !== -1) {
          sessionStorage.removeItem(PIN_STORAGE_KEY);
          setTimeout(() => window.location.reload(), 1200);
        }
        return;
      }

      drawIdLabel.textContent = data.drawId;
      buildCapsuleGrid(data.winners.length);
      revealWinners(data.winners);

    } catch (err) {
      drawError.textContent = 'เชื่อมต่อ Web App ไม่สำเร็จ กรุณาเช็คอินเทอร์เน็ตแล้วลองใหม่';
      drawError.classList.remove('hidden');
    } finally {
      machineDome.classList.remove('machine-shaking');
      drawBtn.disabled = false;
      drawBtnLabel.textContent = '🎉 หมุนสุ่มรางวัล 10 สิทธิ์!';
    }
  });
</script>
</body>
</html>
